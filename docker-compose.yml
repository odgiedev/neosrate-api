services:
  db:
    image: mysql:8
    container_name: neosrate-db
    environment:
      MYSQL_DATABASE: neosrate
      MYSQL_USER: neosrate
      MYSQL_PASSWORD: neosrate
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neosrate-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/neosrate
      SPRING_DATASOURCE_USERNAME: neosrate
      SPRING_DATASOURCE_PASSWORD: neosrate
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      API_SECURITY_TOKEN_SECRET: ${API_SECURITY_TOKEN_SECRET:-change-me}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db-data:
